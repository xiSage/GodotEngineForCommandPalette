name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & test (x64, Debug)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Check formatting
        run: dotnet format GodotEngineForCommandPalette.sln --verify-no-changes --severity info

      - name: Build (x64, Debug)
        run: dotnet build GodotEngineForCommandPalette/GodotEngineForCommandPalette.csproj -r win-x64 -p:Platform=x64

      - name: Test (x64, Debug)
        run: dotnet test GodotEngineForCommandPalette.Tests/GodotEngineForCommandPalette.Tests.csproj -r win-x64 -p:Platform=x64

  build-release:
    name: Build (Release, ${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ matrix.rid }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build (Release, ${{ matrix.platform }})
        run: dotnet build GodotEngineForCommandPalette/GodotEngineForCommandPalette.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}

  package-smoke:
    name: Package smoke test (.msixupload)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build the Store package with the repository's current version
        shell: pwsh
        run: |
          $csproj = 'GodotEngineForCommandPalette/GodotEngineForCommandPalette.csproj'
          $version = ([regex]::Match((Get-Content $csproj -Raw), '<AppxPackageVersion>([^<]*)</AppxPackageVersion>')).Groups[1].Value
          if (-not $version) { throw "Could not read <AppxPackageVersion> from $csproj" }
          Write-Host "Packaging version: $version"
          ./tools/pack-store.ps1 -Version $version
          $uploads = @(Get-ChildItem artifacts -Filter *.msixupload)
          if ($uploads.Count -eq 0) { throw "pack-store.ps1 finished but produced no .msixupload" }
          $uploads | Format-Table Name, Length
